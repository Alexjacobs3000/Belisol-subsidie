<style>
@font-face { font-family: "Nunito"; font-weight: 400; src: url("{{ assets }}/fonts/nunito-latin-400-normal.woff"); }
@font-face { font-family: "Nunito"; font-weight: 600; src: url("{{ assets }}/fonts/nunito-latin-600-normal.woff"); }
@font-face { font-family: "Nunito"; font-weight: 700; src: url("{{ assets }}/fonts/nunito-latin-700-normal.woff"); }
@font-face { font-family: "Nunito"; font-weight: 800; src: url("{{ assets }}/fonts/nunito-latin-800-normal.woff"); }

:root {
  --navy: #00346B;
  --blue: #155197;
  --sky: #7CC4E8;
  --sky-soft: #EAF5FB;
  --ink: #1B2B3F;
  --muted: #5E6E82;
  --line: #D8E3EE;
  --ok: #1F8A5B;
  --warn: #B26A00;
}

@page {
  size: A4;
  margin: 18mm 16mm 22mm 16mm;
  @bottom-left {
    content: "{{ vestiging.weergavenaam }}  ·  {{ vestiging.adres }}, {{ vestiging.postcode_plaats }}  ·  {{ vestiging.telefoon }}  ·  {{ vestiging.email }}";
    font-family: "Nunito"; font-size: 7.5pt; color: #5E6E82;
  }
  @bottom-right {
    content: "Pagina " counter(page) " van " counter(pages);
    font-family: "Nunito"; font-size: 7.5pt; color: #5E6E82;
  }
}
@page :first { margin-top: 0; }

* { box-sizing: border-box; }
body { font-family: "Nunito", "DejaVu Sans", sans-serif; color: var(--ink); font-size: 9.6pt; line-height: 1.45; margin: 0; }
h1, h2, h3 { margin: 0; color: var(--navy); }
h2 { font-size: 13pt; font-weight: 800; margin: 0 0 3mm; }
h2 .light { font-weight: 400; color: var(--blue); }
p { margin: 0 0 2.5mm; }
.muted { color: var(--muted); }

/* ---------- header ---------- */
.hero {
  margin: 0 -16mm; padding: 10mm 16mm 8mm; background: var(--navy); color: #fff;
  display: flex; align-items: center; gap: 8mm; position: relative;
}
.hero img { width: 26mm; height: 26mm; }
.hero .t1 { font-size: 24pt; font-weight: 800; line-height: 1.05; color: #fff; }
.hero .t2 { font-size: 11.5pt; color: var(--sky); margin-top: 1.5mm; }
.hero .meta { margin-left: auto; text-align: right; font-size: 8.5pt; color: #CFE3F3; line-height: 1.6; }
.hero .meta b { color: #fff; font-weight: 700; }
.squares { position: absolute; right: 16mm; bottom: -7mm; width: 14mm; height: 14mm; border: 1.2pt solid var(--sky); }
.squares::after { content: ""; position: absolute; left: -9mm; top: -5mm; width: 9mm; height: 9mm; border: 1.2pt solid #fff; }

/* ---------- address row ---------- */
.addr { display: flex; gap: 8mm; margin: 9mm 0 5mm; }
.addr > div { flex: 1; }
.label { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 1mm; }
.addr .name { font-size: 12pt; font-weight: 800; color: var(--navy); }

/* ---------- KPI tiles ---------- */
.kpis { display: flex; gap: 4mm; margin: 4mm 0 6mm; }
.kpi { flex: 1; border: 1pt solid var(--line); border-radius: 3mm; padding: 4mm 4.5mm; }
.kpi .v { font-size: 20pt; font-weight: 800; color: var(--navy); line-height: 1.1; }
.kpi .v small { font-size: 10pt; font-weight: 700; color: var(--blue); }
.kpi .k { font-size: 8pt; color: var(--muted); margin-top: 1mm; }
.kpi.accent { background: var(--navy); border-color: var(--navy); }
.kpi.accent .v, .kpi.accent .v small { color: #fff; }
.kpi.accent .k { color: var(--sky); }

/* ---------- measures (form data) ---------- */
.measure { border: 1pt solid var(--line); border-left: 3.2mm solid var(--sky); border-radius: 2.5mm; margin-bottom: 4mm; page-break-inside: avoid; }
.measure.door { border-left-color: var(--blue); }
.measure .head { display: flex; align-items: baseline; padding: 3mm 4.5mm 2mm; border-bottom: 1pt solid var(--line); }
.measure .head h3 { font-size: 11pt; font-weight: 800; }
.measure .head .amt { margin-left: auto; font-weight: 800; color: var(--navy); font-size: 11pt; }
.measure .head .amt small { font-weight: 600; color: var(--muted); font-size: 8pt; }
.fields { display: flex; flex-wrap: wrap; padding: 2.5mm 4.5mm 3mm; }
.field { width: 25%; padding: 1mm 2mm 1mm 0; }
.field .v { font-size: 11.5pt; font-weight: 800; color: var(--ink); }
.field .v.code { font-family: "DejaVu Sans Mono", monospace; font-size: 10.5pt; letter-spacing: .03em; color: var(--blue); }
.note { font-size: 8pt; color: var(--muted); padding: 0 4.5mm 3mm; }

.general { background: var(--sky-soft); border-radius: 2.5mm; padding: 4mm 4.5mm; display: flex; flex-wrap: wrap; margin-bottom: 4mm; page-break-inside: avoid; }
.general .field { width: 50%; }
.general .field.full { width: 100%; }
.general .field .v { font-size: 10.5pt; }

/* ---------- table ---------- */
table { width: 100%; border-collapse: collapse; font-size: 8.6pt; }
th { text-align: left; font-size: 7.3pt; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 2mm 1.5mm; border-bottom: 1.2pt solid var(--navy); }
td { padding: 1.3mm 1.5mm; border-bottom: 1pt solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
td img { width: 14mm; height: 10mm; object-fit: contain; object-position: center; display: block; }
tr { page-break-inside: avoid; }
.pill { display: inline-block; padding: .4mm 2.2mm; border-radius: 10mm; font-size: 7.5pt; font-weight: 700; white-space: nowrap; }
.pill.glas { background: var(--sky-soft); color: var(--blue); }
.pill.deur { background: #E3ECF7; color: var(--navy); }
.pill.nee { background: #FBEFE0; color: var(--warn); }
tfoot td { font-weight: 800; color: var(--navy); border-bottom: none; border-top: 1.2pt solid var(--navy); }

/* ---------- steps ---------- */
.two { display: flex; gap: 6mm; page-break-inside: avoid; }
.two > div { flex: 1; }
.steps { counter-reset: s; margin: 0; padding: 0; list-style: none; }
.steps li { position: relative; padding: 0 0 2mm 9mm; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: -.2mm; width: 6mm; height: 6mm; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 800; font-size: 8pt; text-align: center; line-height: 6mm; }
.steps b { color: var(--navy); }
.check { list-style: none; margin: 0; padding: 0; }
.check li { padding: 0 0 1.1mm 6mm; position: relative; }
.check li::before { content: "✓"; position: absolute; left: 0; color: var(--sky); font-weight: 800; }

.declaration { border: 1.2pt solid var(--navy); border-radius: 2.5mm; padding: 4mm 5mm; margin: 5mm 0; page-break-inside: avoid; }
.declaration h2 { font-size: 11.5pt; }
.sign { display: flex; gap: 10mm; margin-top: 7mm; }
.sign > div { flex: 1; border-top: 1pt solid var(--ink); padding-top: 1.5mm; font-size: 8pt; color: var(--muted); }

.disclaimer { font-size: 7.3pt; color: var(--muted); border-top: 1pt solid var(--line); padding-top: 2.5mm; margin-top: 4mm; }
.pb { page-break-before: always; }
table.rb td { vertical-align: top; padding: 2mm 1.5mm; }
table.rb th.hl, table.rb td.hl { background: var(--sky-soft); }
table.rb tr.grand td { font-size: 11pt; padding: 3mm 1.5mm; }
table.rb tr.grand td { background: var(--navy); color: #fff; }
table.rb tr.grand td:first-child { border-radius: 2mm 0 0 2mm; }
table.rb tr.grand td:last-child { border-radius: 0 2mm 2mm 0; }
.scen { display: flex; gap: 4mm; margin: 3mm 0 2mm; font-size: 8pt; color: var(--muted); }
.scen > div { flex: 1; border-top: 2pt solid var(--sky); padding-top: 1.5mm; }
.scen b { color: var(--navy); }
h2.section { margin-top: 7mm; }
.section { margin-top: 5mm; }
</style>
